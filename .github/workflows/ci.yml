name: CI

on:
  push:
      branches: [main]
    pull_request:
      branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:api
      - run: npm run build:web
      # Deploy step will be added once Terraform infra (Phase 1 wrap-up) is live.